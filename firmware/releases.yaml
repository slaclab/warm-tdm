      - mcs.gz

  ColumnFpgaBoard325Int:
    ImageDir: targets/ColumnFpgaBoard325Int/images
    Extensions:
      - mcs.gz

  ColumnFpgaBoard325Fp1G:
    ImageDir: targets/ColumnFpgaBoard325Fp1G/images
    Extensions:
      - mcs.gz

  ColumnFpgaBoard325Int1G:
    ImageDir: targets/ColumnFpgaBoard325Int1G/images
    Extensions:
      - mcs.gz

  ColumnFpgaBoard325Fp10G:
    ImageDir: targets/ColumnFpgaBoard325Fp10G/images
    Extensions:
      - mcs.gz

  ColumnFpgaBoard325Int10G:
    ImageDir: targets/ColumnFpgaBoard325Int10G/images
    Extensions:
      - mcs.gz

  RowFpgaBoard160:
    ImageDir: targets/RowFpgaBoard160/images
