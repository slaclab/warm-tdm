GitBase: ..

TopRoguePackage: warm_tdm

RoguePackages:
  - python
  - ../software/python

RogueScripts:
  - ../software/scripts/_setupLibPaths.py
  - ../software/scripts/inspect_stream.py
  - ../software/scripts/PromLoader
  - ../software/scripts/warmTdmClientCmd.py
  - ../software/scripts/warmTdmClientGui.py
  - ../software/scripts/warmTdmGui.py
  - ../software/scripts/warmTdmServer.py

CondaDependencies:
  - python>=3.8
  - rogue
  - numpy
  - scipy
  - pyyaml
  - pyzmq
  - parse
  - click
  - pyqt
  - pyserial
  - pydm
  - matplotlib
  - simple-pid
  - sympy

RogueConfig:

