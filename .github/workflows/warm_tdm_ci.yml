# The following environment variables are required for this process:
# secrets.GH_TOKEN

name: WarmTDM Integration
on: [push]

jobs:

  test_and_document:
    name: Test And Generate Documentation
    runs-on: ubuntu-24.04
    steps:

      # This step checks out a copy of your repository.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          sudo apt-get update
          python -m pip install --upgrade pip
          pip install -r pip_requirements.txt

      - name: Python Syntax Check
        run: |
          python -m compileall -f software/python/
          python -m compileall -f firmware/python/
          #flake8 --count software/python/
          #flake8 --count firmware/python/

      - name: Generate Documentation
        if: github.ref == 'refs/heads/doc_test'
        run: |
          cd docs
          make html

      - name: Deploy Documentation
        if: github.ref == 'refs/heads/doc_test'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: docs/build/html

# ----------------------------------------------------------------------------

  # Generate a GitHub release when a version tag (vX.Y.Z) is pushed.
  # Firmware .mcs images are attached to the release separately by a
  # maintainer running ruckus/scripts/firmwareRelease.py (see docs/RELEASE.md),
  # since FPGA images cannot be built in CI.
  gen_release:
    needs: [test_and_document]
    permissions:
      contents: write
    uses: slaclab/ruckus/.github/workflows/gen_release.yml@main
    with:
      version: '1.0.0'
    secrets:
      GH_TOKEN: ${{ github.token }}

